[project]
name = "docuvoice"
version = "0.1.0"
description = "Offline-first identity document processing and voice-assisted form filling"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dateparser>=1.4.3",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.25.0",
    "numpy>=2.3.5",
    "paddleocr>=3.7.0",
    "paddlepaddle==3.2.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
